<a class="saltar" href="#contenido">Saltar al contenido</a>

    <header class="cabecera">
      <div class="cab-fila">
        <button type="button" class="btn-icono btn-menu" (click)="menuAbierto.set(!menuAbierto())"
                [attr.aria-expanded]="menuAbierto()" aria-controls="menu-movil"
                [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'">
          <app-icono [nombre]="menuAbierto() ? 'cerrar' : 'menu'" />
        </button>

        <a routerLink="/" class="logo" aria-label="Motorsport Analytics - inicio">
          <svg class="logo-marca" viewBox="0 0 30 22" aria-hidden="true">
            <path d="M7 0h5L5 22H0z" fill="#e50914" />
            <path d="M16 0h5l-7 22H9z" fill="#e50914" />
            <path d="M25 0h5l-7 22h-5z" fill="#e50914" />
          </svg>
          <span class="logo-texto">Motorsport Analytics</span>
        </a>
      </div>

      <div class="subnav">
        <div class="subnav-fila">
          <nav aria-label="Secciones" class="fila">
            @for (s of secciones; track s.ruta) {
              <a [routerLink]="s.ruta" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: s.ruta === '/' }">
                <app-icono [nombre]="s.icono" [tamanio]="18" />{{ s.texto }}
              </a>
            }
          </nav>
        </div>
      </div>

      @if (menuAbierto()) {
        <div class="menu-movil" id="menu-movil">
          <div>
            <h2>Secciones</h2>
            <nav aria-label="Secciones (móvil)">
              @for (s of secciones; track s.ruta) {
                <a [routerLink]="s.ruta" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: s.ruta === '/' }">
                  <app-icono [nombre]="s.icono" [tamanio]="18" />{{ s.texto }}
                </a>
              }
            </nav>
          </div>
        </div>
      }
    </header>

    <main id="contenido" class="contenido">
      <router-outlet />
    </main>

    <footer class="pie">
      TFI · Tecnicatura Universitaria en Programación · UTN · Grupo 190
    </footer>
