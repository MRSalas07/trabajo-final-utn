# =====================================================================
# Motorsport Analytics - configuracion del backend
# Todos los valores sensibles se leen de variables de entorno o del
# archivo .env
# =====================================================================
spring.application.name=motorsport
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# ---Se configura la Base de datos (PostgreSQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/motorsport_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---Configuración de JPA / Hibernate ---
# El esquema lo crea database/schema.sql (ver database/README.md).
# validate: al iniciar, Hibernate solo verifica que las entidades coincidan con las tablas; nunca las modifica.
# No usar "update": esconde las diferencias entre el codigo y los scripts, y en la base de la nube podria
# alterar tablas sin control. Si una entidad necesita una columna nueva, se agrega en schema.sql y en una
# migracion nueva de database/migraciones/ (ver database/README.md, "Cambios al esquema").
spring.jpa.hibernate.ddl-auto=validate
# Las consultas se hacen solo dentro de los servicios (@Transactional): fuera de ellos no se carga nada perezoso
spring.jpa.open-in-view=false

# Configuracion para guardar las fechas de eventos/sesiones/etapas en UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Las columnas de evento/sesion/etapa son TIMESTAMP WITHOUT TIME ZONE: Instant se mapea a ese tipo
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# --- JSON ---
spring.jackson.time-zone=UTC

# --- Documentacion OpenAPI (Swagger UI en /swagger-ui.html) ---
springdoc.swagger-ui.path=/swagger-ui.html


# --- Seguridad (JWT) ---
# Clave HMAC de al menos 32 caracteres.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:240}
# Emails (separados por coma) que reciben el rol ADMIN al iniciar sesion
app.admin.emails=${ADMIN_EMAILS:}

# --- CORS: origenes del frontend (separados por coma) ---
app.cors.origenes-permitidos=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Integracion con APIs externas ---
app.integracion.timeout-conexion-ms=${INTEGRACION_TIMEOUT_CONEXION_MS:5000}
app.integracion.timeout-lectura-ms=${INTEGRACION_TIMEOUT_LECTURA_MS:20000}
app.integracion.reintentos=${INTEGRACION_REINTENTOS:3}
# F1 - Jolpica (sucesor de Ergast). Sin clave. Limite publico ~4 req/s y ~500 req/hora.
app.integracion.f1.url-base=${F1_JOLPICA_URL_BASE:https://api.jolpi.ca/ergast/f1/}
app.integracion.f1.intervalo-minimo-ms=${JOLPICA_INTERVALO_MS:400}
# WRC - endpoint NO OFICIAL usado por wrc.com (Red Bull). Puede cambiar sin aviso.
app.integracion.wrc.url-base=${WRC_URL_BASE:https://p-p.redbull.com/rb-wrccom-lintegration-yv-prod/api/}
app.integracion.wrc.intervalo-minimo-ms=${WRC_INTERVALO_MS:300}
app.integracion.wrc.habilitado=${WRC_HABILITADO:true}
# Sincronizacion automatica diaria de la temporada actual (desactivada por defecto)
app.integracion.sync-automatica=${SYNC_AUTOMATICA:false}
app.integracion.sync-cron=${SYNC_CRON:0 0 6 * * *}
