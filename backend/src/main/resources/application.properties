# =====================================================================
# Motorsport Analytics - configuracion del backend
# Todos los valores sensibles se leen de variables de entorno o del
# archivo .env
# =====================================================================
spring.application.name=motorsport
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# ---Se configura la Base de datos (PostgreSQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/motorsport_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---Configuración de JPA / Hibernate ---
# El esquema lo crean database/schema.sql + database/migraciones/*.sql.
# Se configura para que Hibernate y solo validad que las entidades coincidan con las tablas al iniciar.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Configuracion para guardar las fechas de eventos/sesiones/etapas en UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Las columnas de evento/sesion/etapa son TIMESTAMP WITHOUT TIME ZONE: Instant se mapea a ese tipo
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# --- JSON ---
spring.jackson.time-zone=UTC

# --- Documentacion OpenAPI (Swagger UI en /swagger-ui.html) ---
springdoc.swagger-ui.path=/swagger-ui.html