# Perfil de pruebas: base H2 en memoria (no requiere PostgreSQL)
spring.datasource.url=jdbc:h2:mem:motorsport;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Valores ficticios solo para los tests
app.jwt.secret=clave-de-prueba-para-tests-de-al-menos-32-caracteres
app.admin.emails=admin@test.local
app.telemetria.habilitada=false
app.integracion.sync-automatica=false
